<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>wplace ジャンクションテンプレート</title>
    <link
      rel="canonical"
      href="https://rc-tools.wplaceoki.com/junctionTemplates"
    />
    <link rel="preload" href="./style.css" as="style" />
    <link rel="stylesheet" href="./style.css" />
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "d6bd2c0d2fca4165b0b5faa0d853c779"}'
    ></script>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-FSQYW6S77K"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-FSQYW6S77K");
    </script>
  </head>

  <body>
    <header class="app-header">
      <div class="header-inner">
        <h1>ジャンクションテンプレート</h1>
        <button
          id="menuBtn"
          class="menu-btn"
          aria-label="メニュー"
          aria-controls="menuPanel"
          aria-expanded="false"
        >
          ☰
        </button>
      </div>
    </header>

    <nav id="menuPanel" class="menu-panel" hidden>
      <ul>
        <li><a href="./">ホーム</a></li>
        <li><a href="./ConvertUrl">地図URL変換ツール</a></li>
        <li><a href="./urlCoordinates">URL座標変換ツール</a></li>
        <li><a href="./planPolyline">折れ線プランナー</a></li>
        <li><a href="./paintCalc">ペイント量計算ツール</a></li>
        <li><a href="./finishPaint">完成予定日計算</a></li>
        <li><a href="./roadDesign">道路作図</a></li>
        <li><a href="./junctionTemplates">ジャンクションテンプレート</a></li>
      </ul>
    </nav>

    <main class="app-main">
      <div class="container">
        <section class="card">
          <h2>テンプレート一覧</h2>
          <div id="catalog"></div>
        </section>
        <section class="card">
          <div class="field">
            <label for="upload">共有する .wplace ファイル（1.5 MBまで）</label
            ><input id="upload" name="upload" type="file" accept=".wplace" />
          </div>
          <div class="actions">
            <button id="publish" class="primary" type="button" disabled>アップロードして一覧に公開</button>
            <a id="published"></a>
          </div>
        </section>
        <section id="output" class="card" hidden>
          <h2>プレビュー</h2>
          <img id="preview" class="preview" alt="テンプレート" />
          <div class="field">
            <label for="placement">設置地点（中心の wplace URL）</label>
            <input id="placement" type="url" placeholder="https://wplace.live/?lat=…&amp;lng=…" />
          </div>
          <div class="actions">
            <a id="download" download="template.wplace"
              >.wplace をダウンロード</a
            ><button id="share" class="primary" type="button">
              共有リンクを発行</button
            ><a id="shared"></a>
          </div>
        </section>
        <p id="message" role="status"></p>
      </div>
    </main>

    <footer class="app-footer">
      <div class="container">
        <p class="muted">© wplace沖ノ鳥島開発 道路公社技術部</p>
      </div>
    </footer>

    <script type="module" src="./junctionTemplates.js"></script>
  </body>
</html>
